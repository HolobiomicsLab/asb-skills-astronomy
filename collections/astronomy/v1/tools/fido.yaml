evidence_spans:
- FIDO takes the evolved CME from ANTEATR with the position and orientation from ForeCAT and passes the CME over a synthetic spacecraft.
- Finally, ForeCAT In situ Data Observer produces in situ profiles for a CME's interaction with a synthetic spacecraft.
