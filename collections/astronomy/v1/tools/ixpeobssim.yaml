evidence_spans:
- ixpeobssim is a simulation and analysis framework specifically developed for the Imaging X-ray Polarimetry Explorer (IXPE).
- The main interface for binning photon lists is provided by |xpbin|
- pipeline.xpbin(*file_list, algorithm='PHA1')
- There are many ways you can contribute ixpeobssim
- ':mod:`ixpeobssim.bkg.instr` in which the function create_background_template

  is defined and invoked by |xpbkgtemplate|'
- ixpeobssim provides ways to simulate background components and handle backgrounds
